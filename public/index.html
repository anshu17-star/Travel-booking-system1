<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Booking System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">✈️ TravelEase India</div>
    <nav>
      <a href="#" onclick="showSection('home')">Home</a>
      <a href="#" onclick="showSection('my-bookings')" id="nav-bookings" style="display:none;">My Bookings</a>
      <span id="user-info"></span>
      <button id="auth-btn" onclick="openAuthModal()">Login / Register</button>
    </nav>
  </header>

  <main>
    <section id="home" class="active-section">
      <div class="hero">
        <h1>Explore Incredible India</h1>
        <p>Find & Book Flights, Hotels, and Tours across India at best prices</p>
        
        <div class="search-bar">
          <input type="text" id="search-location" placeholder="Where do you want to go in India?">
          <select id="search-type">
            <option value="All">All Types</option>
            <option value="Flight">Flight</option>
            <option value="Hotel">Hotel</option>
            <option value="Tour">Tour</option>
          </select>
          <button onclick="searchDestinations()">Search</button>
        </div>
      </div>

      <div class="container">
        <h2>Popular Indian Destinations & Packages</h2>
        <div id="destinations-grid" class="grid"></div>
      </div>
    </section>

    <section id="my-bookings" class="container hidden">
      <h2>My Travel Bookings</h2>
      <div id="bookings-list"></div>
    </section>
  </main>

  <div id="auth-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeAuthModal()">&times;</span>
      <div class="auth-tabs">
        <button id="tab-login" class="active" onclick="switchAuthTab('login')">Login</button>
        <button id="tab-register" onclick="switchAuthTab('register')">Register</button>
      </div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <input type="email" id="login-email" placeholder="Email Address" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>

      <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
        <input type="text" id="reg-name" placeholder="Full Name" required>
        <input type="email" id="reg-email" placeholder="Email Address" required>
        <input type="password" id="reg-password" placeholder="Password" required>
        <button type="submit">Register</button>
      </form>
    </div>
  </div>

  <div id="booking-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeBookingModal()">&times;</span>
      <h2>Confirm Booking</h2>
      <p id="booking-item-title"></p>
      
      <form id="booking-form" onsubmit="confirmBooking(event)">
        <label>Travel Date (Must be after today):</label>
        <input type="date" id="book-date" onchange="validateBookingDate()" required>
        <div id="date-error" class="error-msg hidden"></div>
        
        <label>Number of Guests:</label>
        <input type="number" id="book-guests" value="1" min="1" max="10" onchange="calculateTotal()" required>
        
        <p>Total Price: ₹<span id="book-total">0</span></p>
        <button type="submit">Proceed to Payment</button>
      </form>
    </div>
  </div>

  <div id="payment-modal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closePaymentModal()">&times;</span>
      <h2>Payment Gateway</h2>
      <p>Total Amount: ₹<span id="pay-amount">0</span></p>

      <form id="payment-form" onsubmit="processPayment(event)">
        <input type="text" id="pay-name" placeholder="Cardholder Name" required>
        <input type="text" id="pay-card" placeholder="Card Number (16 digits)" maxlength="16" required>
        <div id="card-error" class="error-msg hidden"></div>
        <div class="row">
          <input type="text" id="pay-expiry" placeholder="MM/YY (e.g. 10/26)" maxlength="5" required>
          <input type="password" id="pay-cvv" placeholder="CVV" maxlength="3" required>
        </div>
        <div id="expiry-error" class="error-msg hidden"></div>
        <button type="submit" class="pay-btn">Pay Now & Confirm</button>
      </form>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Travel Booking System.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
